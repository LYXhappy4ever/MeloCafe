name: Build MeloCafe iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MeloCafe/MeloCafe.xcodeproj \
            -scheme MeloCafe

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project MeloCafe/MeloCafe.xcodeproj \
            -scheme MeloCafe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData/Build/Products -type d -name 'MeloCafe.app' | head -n 1)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/MeloCafe.app
          /usr/bin/zip -qry MeloCafe-1.0-zh-Hans-gyro-menu-bgfix.ipa Payload
          shasum -a 256 MeloCafe-1.0-zh-Hans-gyro-menu-bgfix.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: MeloCafe-iOS-IPA
          path: MeloCafe-1.0-zh-Hans-gyro-menu-bgfix.ipa
          if-no-files-found: error
